# config/human_pfc_libraries.yml
#
# Prototype, not part of the main human pipeline: per-library Stage 0 for the
# GSE244618 PFC libraries (src/snakemake/human_prototype/pfc_libraries.smk).
# Loaded on top of config/human_prototype.yml, whose paths and parameters
# (genome, JASPAR, atlas, QC and chromVAR settings) it reuses.

pfc:
  # {gsm_stub} is the GSM accession with its last three digits replaced by "nnn".
  snap_url_template: "https://ftp.ncbi.nlm.nih.gov/geo/samples/{gsm_stub}/{gsm}/suppl/{gsm}_{library}.snap.gz"
  # Loop universe (built by the main pipeline) and Stage 0 feature sets (names from
  # feature_sets in human_prototype.yml). feature_set must have no cell partition.
  # cellclass_feature_set must have one, but only its column is used: each library
  # is partitioned by its own cell_metadata.tsv, not by the partition path given
  # there (that one is the main pipeline's sample).
  negatives: "n2"
  feature_set: "motif"
  cellclass_feature_set: "motif_x_cellclass"
  # Atlas library id -> GEO accession, region and donor (GSE244618 sample records):
  # the prefrontal neocortex regions A46 (dlPFC), A44-A45 and A25 from donors 1, 2, 4.
  libraries:
    MM_417:  {gsm: "GSM7822145", region: "A46",     donor: "Donor 1"}
    MM_418:  {gsm: "GSM7822146", region: "A46",     donor: "Donor 2"}
    MM_841:  {gsm: "GSM7822147", region: "A46",     donor: "Donor 4"}
    XH_496:  {gsm: "GSM7822157", region: "A44-A45", donor: "Donor 1"}
    MM_436:  {gsm: "GSM7822158", region: "A44-A45", donor: "Donor 2"}
    MM_863:  {gsm: "GSM7822159", region: "A44-A45", donor: "Donor 4"}
    QY_1468: {gsm: "GSM7822196", region: "A25",     donor: "Donor 1"}
    QY_1470: {gsm: "GSM7822197", region: "A25",     donor: "Donor 2"}
    MM_837:  {gsm: "GSM7822198", region: "A25",     donor: "Donor 4"}
  # Pooled-cell models (src/snakemake/human_prototype/pfc_pools.smk): Stage 0 and
  # Stage 1 on the analysis cells of several libraries pooled. chromVAR scores stay
  # per library (each library's own peaks and background); pooling adds up each loop's
  # "1-1" / other chromVAR sums and cell counts over the libraries.
  pools:
    # donor 4 is left out (almost no neurons)
    libraries: ["MM_417", "MM_418", "XH_496", "MM_436", "QY_1468", "QY_1470"]
    # feature set -> attribute of pfc.libraries that splits the pooled libraries into
    # groups, each pooled separately (one feature per motif x group); null = one pool.
    feature_sets:
      motif_x_region: "region"   # model (a): one pool per brain region, donors together
      motif_pooled: null         # model (b): every cell in one pool
