# config/human_prototype.yml
#
# Human-brain loop-prediction prototype. Separate from the Drosophila
# config/config.yml; the two pipelines share no configuration.

# Sample: MM_417 (A46 / dlPFC), neuron-viable (~17% neurons).
sample: "MM_417"
snap: "data/human_prototype/raw/GSM7822145_MM_417.snap"
# GEO supplementary .snap.gz for this sample; download_snap fetches and decompresses it.
snap_url: "https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM7822nnn/GSM7822145/suppl/GSM7822145_MM_417.snap.gz"
# Public S3 bucket (Rahman et al. 2023) for the per-condition loop BEDs; download_loop_bed
# fetches "<loops_base_url>/<condition>_loop.bed.gz".
loops_base_url: "https://pengfei-mssm.s3.amazonaws.com"
genome: "data/human_prototype/ref/hg38.fa"
# UCSC hg38 FASTA (gzipped); download_genome fetches, decompresses and indexes it (.fai).
genome_url: "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/hg38.fa.gz"
# CATlas (Li 2023) full single-nucleus metatable (hba.whole.final.meta), gzipped,
# provided MANUALLY on the server (no stable download URL). annotate_cells needs the
# barcode/sample/cellclass/subclass/celltype columns, so this must be the FULL CATlas
# metatable - NOT the paper's 3-column supplementary "Table S3 ... .txt" (sample,
# barcode, celltype only), which lacks cellclass/subclass. Upload the repo's own
# validated file (data/human_prototype/annotation/TableS3_single_nuclei_metatable.gz).
annotation: "data/human_prototype/annotation/TableS3_single_nuclei_metatable.gz"
raw_dir: "data/human_prototype/raw"
# JASPAR CORE vertebrate motifs (PFM flat file); download_jaspar fetches it.
jaspar: "data/human_prototype/ref/JASPAR2026_CORE_vertebrates.jaspar"
jaspar_url: "https://jaspar.elixir.no/download/data/2026/CORE/JASPAR2026_CORE_vertebrates_non-redundant_pfms_jaspar.txt"

conditions:
  - "fetal"
  - "glia"
  - "neuron"

# How each condition's negative loops are drawn; every listed mode is run. Every
# step from the loop universe on writes under data/human_prototype/interim/<negatives>/
# and results/human_prototype/<negatives>/, so the two modes never overwrite each other.
# A single mode can be run with `--config negatives=n2`.
#   other_conditions - the other conditions' loops whose Hi-C rectangle coincides with
#                      no real loop of the condition (pairToPair -type both); parameter-free.
#   n2               - Cupriak's new_pairs_of_anchors: random new pairs of the condition's
#                      own anchors, neg_pos_ratio[condition] per positive (minus the few that
#                      overlap a real loop rectangle), drawn with random_state.
negatives:
  - "other_conditions"
  - "n2"
# n2 only: negatives drawn per positive, per condition. Set to other_conditions'
# negatives / positives so both modes have the same class balance (counts from the
# wloczykij build_loop_universe.log, 2026-10-05; int(ratio * positives) reproduces
# the negative count exactly):
#   fetal 41230 / 26264, glia 41389 / 27342, neuron 37583 / 28576
neg_pos_ratio:
  fetal: 1.56983
  glia: 1.513752
  neuron: 1.315195
random_state: 42          # n2 only (Cupriak's random_state)

# Stage 0 feature sets; every listed set is built and trained for every negative mode.
# Each maps to the cell partition its enrichment is computed within:
#   null                  - no partition: "1-1" vs all other analysis cells, one feature
#                           per motif;
#   {partition, column}   - a TSV with a barcode column that assigns every analysis cell
#                           (QC-passing, atlas-annotated) to exactly one group in `column`;
#                           "1-1" vs "other" is computed within each group's cells and the
#                           groups are stacked, one feature per motif x group.
feature_sets:
  motif: null
  motif_x_cellclass:
    partition: "data/human_prototype/interim/cell_metadata.tsv"
    column: "cellclass"

min_fragments: 1000       # unique-fragment QC threshold
min_cells_per_peak: 1    # keep every accessible peak (chromVAR default; filterPeaks drops the rest)
bg_iterations: 50         # chromVAR background peak sets (chromVAR default)
model: "XGB"
n_splits: 10
# Threads per job. Every heavy rule declares these and pins its BLAS / OpenMP
# threads to them, so `--cores N` really caps the whole run at N cores.
# Stage 0 has 4 jobs (negative mode x feature set), Stage 1 has 12 (x condition).
stage0_threads: 3
stage1_threads: 4
# Stage 2 (SHAP) has 12 jobs (negative mode x feature set x condition); each holds the
# feature matrix and a same-sized SHAP matrix (~1.6 GB each for motif x cellclass).
shap_threads: 4

# chromVAR's BLAS threads; below --cores so anchor openness and the loop
# universes can run alongside it.
blas_threads: 8
