# Human-prototype preprocessing environment: reading the GEO .snap HDF5,
# fragment/anchor overlap, and the Stage 0/1 math. chromVAR runs in R
# (env/human_prep_r.yaml).
name: human_prep
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - h5py
  - anndata
  - pysam
  - pyranges          # anchor_openness fragment/anchor overlap
  - bedtools          # backs pybedtools (build_loop_universe)
  - pybedtools        # build_loop_universe anchor-overlap fractions
  - scikit-learn
  - matplotlib
  - tqdm
  - pyyaml
  - pip
  - pip:
      - xgboost
      - pyreadr
